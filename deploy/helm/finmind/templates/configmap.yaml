apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finmind.fullname" . }}-config
  namespace: {{ .Values.namespace }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  GEMINI_MODEL: {{ .Values.config.geminiModel | quote }}
  REDIS_URL: "redis://{{ include "finmind.fullname" . }}-redis:{{ .Values.redis.port }}/0"
