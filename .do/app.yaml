name: finmind
services:
  - name: backend
    dockerfile_path: packages/backend/Dockerfile
    source_dir: packages/backend
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.DATABASE_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
sites:
  - name: frontend
    source_dir: app
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
databases:
  - name: db
    engine: PG
    version: "16"
  - name: redis
    engine: REDIS
    version: "7"
